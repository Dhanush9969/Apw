<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéQuiz | Section B</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <div id="setup-screen">
            <h1>Pokémon Master Quiz</h1>
            <button onclick="startQuiz()" class="btn">Start Journey</button>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="header">
                <span id="progress">Question 1/5</span>
                <span id="score-display">Score: 0</span>
            </div>
            
            <div id="question-box">
                <img id="poke-img" src="" alt="Pokemon Image" class="poke-sprite">
                <h2 id="question-text">Loading Question...</h2>
            </div>

            <div id="options-container" class="options-grid">
                <!-- Buttons generated by JS -->
            </div>
        </div>

        <div id="result-screen" class="hidden">
            <h2>Quiz Complete!</h2>
            <p id="final-score"></p>
            <button onclick="location.reload()" class="btn">Try Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
