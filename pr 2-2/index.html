<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCheck | BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-box">
        <h1>BMI Calculator</h1>
        <p>Enter your details below to calculate your Body Mass Index.</p>
        
        <div class="input-container">
            <label>Weight (kg)</label>
            <input type="number" id="weight" placeholder="e.g. 70" required>
        </div>

        <div class="input-container">
            <label>Height (cm)</label>
            <input type="number" id="height" placeholder="e.g. 175" required>
        </div>

        <button onclick="calculateBMI()" class="calc-btn">Calculate Now</button>

        <div id="result-area" class="hidden">
            <div class="score-circle">
                <span id="bmi-score">00.0</span>
            </div>
            <h3 id="bmi-category">Category</h3>
            <p id="bmi-msg">Message goes here.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
